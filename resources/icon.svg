<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Markdowns In Graph">
  <title>Markdowns In Graph</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#191E29"/>
      <stop offset="0.55" stop-color="#12151C"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.46" cy="0.5" r="0.52">
      <stop offset="0" stop-color="#6EA8FE" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#6EA8FE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6EA8FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8FBEFF"/>
      <stop offset="1" stop-color="#5A92EF"/>
    </linearGradient>
    <filter id="hubGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.43  0 0 0 0 0.66  0 0 0 0 1  0 0 0 0.5 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板：深色圆角方块 -->
  <rect width="1024" height="1024" rx="200" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="200" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="199" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- 连线 -->
  <g fill="none" stroke="#A9B6CF" stroke-opacity="0.45" stroke-width="11" stroke-linecap="round">
    <path d="M470 512 L252 302"/>
    <path d="M470 512 L762 286"/>
    <path d="M470 512 L282 744"/>
    <path d="M470 512 L706 792"/>
    <path d="M470 512 L842 536"/>
    <path d="M252 302 L282 744"/>
    <path d="M762 286 L842 536"/>
    <path d="M282 744 L706 792"/>
  </g>

  <!-- 卫星节点 -->
  <g>
    <circle cx="252" cy="302" r="56" fill="#73DACA"/>
    <circle cx="762" cy="286" r="48" fill="#E0AF68"/>
    <circle cx="282" cy="744" r="45" fill="#BB9AF7"/>
    <circle cx="842" cy="536" r="29" fill="#7DCFFF"/>
    <circle cx="706" cy="792" r="37" fill="#E6EAF2"/>
  </g>

  <!-- 中心笔记节点：圆角方形 + 三行文字 -->
  <g filter="url(#hubGlow)">
    <rect x="386" y="428" width="168" height="168" rx="42" fill="url(#hub)"/>
    <rect x="386.5" y="428.5" width="167" height="167" rx="41.5" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <g fill="#0E1117" fill-opacity="0.62">
      <rect x="418" y="478" width="104" height="14" rx="7"/>
      <rect x="418" y="505" width="104" height="14" rx="7"/>
      <rect x="418" y="532" width="64" height="14" rx="7"/>
    </g>
  </g>
</svg>
